name: Flutter build

on:
  push:
    branches:
      - '**'
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter-build.yml'
  pull_request:
    branches: [main]
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter-build.yml'
  workflow_dispatch:

jobs:
  android:
    name: Analyze, test, and build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.24.5'
          cache: true

      - name: Generate Flutter platform scaffolding
        run: |
          flutter create --platforms=android --org hk.beckonstars.dev .
          rm -f test/widget_test.dart

      - name: Use test app identity
        run: |
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path('android/app/build.gradle')
          text = gradle.read_text()
          text = text.replace('namespace = "hk.beckonstars.dev.beckon_stars"', 'namespace = "hk.beckonstars.dev.beckon_stars_test"')
          text = text.replace('applicationId = "hk.beckonstars.dev.beckon_stars"', 'applicationId = "hk.beckonstars.dev.beckon_stars_test"')
          gradle.write_text(text)

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          text = text.replace('android:label="beckon_stars"', 'android:label="星喚測試"')
          manifest.write_text(text)
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Flutter app
        run: flutter analyze

      - name: Run Flutter tests
        run: flutter test

      - name: Build debug APK
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL || 'http://144.79.170.102:8787' }}
        run: |
          if [[ ! "$API_BASE_URL" =~ ^https?:// ]]; then
            echo "API_BASE_URL must start with http:// or https://" >&2
            exit 1
          fi
          flutter build apk --debug --dart-define="API_BASE_URL=$API_BASE_URL"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: flutter-app-debug-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
